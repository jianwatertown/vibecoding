<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Slowcelona Sunday pickup soccer. Scan the QR code or open check-in to record your attendance.">
  <meta name="theme-color" content="#183e2d">
  <title>Slowcelona · Soccer check-in</title>
  <style>
    :root { color-scheme:light; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#183e2d; background:#f4f5ef; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; padding:28px 20px; }
    main { max-width:440px; margin:0 auto; }
    header { display:flex; align-items:center; gap:10px; font-size:13px; font-weight:800; letter-spacing:2px; margin-bottom:30px; }
    .badge { display:grid; place-items:center; width:34px; height:34px; border-radius:50%; background:#183e2d; color:#d5f18a; font-size:20px; }
    .eyebrow { font-size:12px; font-weight:700; letter-spacing:1.8px; text-transform:uppercase; color:#657464; }
    h1 { font-size:44px; line-height:1.08; letter-spacing:-2px; margin:12px 0 14px; }
    p { color:#626c62; line-height:1.6; }
    .intro { margin:0 0 22px; }
    .qr-card { margin:0; background:white; border:1px solid #dce1d5; border-radius:20px; padding:16px; }
    .qr-card img { display:block; width:100%; height:auto; aspect-ratio:1; }
    figcaption { text-align:center; color:#626c62; font-size:14px; line-height:1.6; margin:0 0 10px; }
    .button { display:flex; align-items:center; justify-content:center; width:100%; min-height:58px; padding:14px 18px; border-radius:12px; text-decoration:none; font:inherit; font-size:17px; font-weight:750; cursor:pointer; }
    .primary { margin-top:20px; border:0; background:#183e2d; color:#e9ffba; }
    .secondary { margin-top:12px; border:1px solid #b6c2b1; background:transparent; color:#183e2d; font-size:14px; font-weight:600; }
    .button:focus-visible { outline:3px solid #8fac46; outline-offset:3px; }
    .hint { font-size:13px; text-align:center; margin:15px 0 0; }
    footer { font-size:12px; text-align:center; color:#7a8479; margin-top:28px; }
    @media (max-width:360px) { h1 { font-size:38px; } .qr-card { padding:10px; } }
    @media print {
      @page { margin:18mm; }
      body { background:white; padding:0; }
      main { max-width:140mm; }
      header { margin-bottom:20px; }
      .no-print { display:none; }
      .qr-card { border:0; padding:0; }
      .qr-card img { max-width:125mm; margin:0 auto; }
      .qr-card,header,h1 { break-inside:avoid; }
      footer { margin-top:16px; }
    }
  </style>
</head>
<body>
